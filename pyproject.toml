[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-curtailment"
version = "0.1.0"
description = "A model of wind generation and curtailment in Ireland"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "rasterio",
    "pandas",
    "geopandas",
    "shapely",
]

[tool.setuptools.packages.find]
where = ["src"]


